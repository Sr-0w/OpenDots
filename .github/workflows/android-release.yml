name: Android release

# Builds the native Android app (apps/android) and publishes the APK as a GitHub pre-release.
# Runs when apps/android/RELEASE changes (it holds the tag to publish, e.g. android-v0.1.0-alpha.1),
# when such a tag is pushed, or manually with a tag name.
on:
  push:
    tags: ['android-v*']
    branches: ['**']
    paths: ['apps/android/RELEASE']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. android-v0.1.0-alpha.1)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else tag="$(tr -d '[:space:]' < apps/android/RELEASE)"; fi
          case "$tag" in android-v[0-9]*) ;; *) echo "Bad tag: $tag"; exit 1;; esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Build APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="OpenDots-${TAG#android-v}.apk"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "$TAG" "$apk" --prerelease --target "$GITHUB_SHA" \
            --title "OpenDots Android ${TAG#android-v}" \
            --notes "Alpha build of the native Android app (Kotlin, Jetpack Compose, Quiet UI). Debug-signed: uninstall it before installing a later build signed with another key. Requires Android 8.0+; backdrop blur needs Android 12+. Connect it to your own OpenDots server (HTTPS)."
